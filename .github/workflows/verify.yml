name: Verify
# Runs on what can still change the outcome, once per change (docs/local-development.md, "CI and Actions minutes"):
# - a pull request is verified on its merge with main, but not while it is a draft;
# - a release tag is verified again before anything is published (release.yml calls this workflow);
# - pushes to main are not built: a pull request was verified on the merge with main, and the next tag verifies main.
# Documentation-only changes are not built (the website workflow builds docs/). A branch without a pull request, or main,
# can be verified from the Actions tab (workflow_dispatch).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
      - 'benchmarks/compare/**'
      - 'Design prototype/**'
      - '.claude/**'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels the run in progress. Release tags have their own group (github.ref is the tag), so a
# release is never cancelled by a push.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Portainer stack is up to date
        run: |
          sh deploy/build-portainer-stack.sh
          git diff --exit-code -- deploy/compose.portainer.yaml || { echo "Run deploy/build-portainer-stack.sh and commit compose.portainer.yaml"; exit 1; }
      - name: Local image defaults are untagged dev images
        run: |
          # ${X_IMAGE:-ume-llm-gateway/<service>:latest} is the locally built image; a release bundle pins the pushed one
          # (release.yml derives the real version from the pushed git tag, not from a committed version).
          stale="$(grep -Hn 'ume-llm-gateway/[a-z]*:' deploy/compose.prod.yaml deploy/compose.portainer.template.yaml deploy/compose.portainer.yaml | grep -v ':latest}' || true)"
          stale="$stale$(grep -rHn 'image: ume-llm-gateway/' deploy/kubernetes | grep -v ':latest$' || true)"
          stale="$stale$(grep -Hn 'newTag:' deploy/kubernetes/example/kustomization.yaml | grep -v 'newTag: \"latest\"' || true)"
          [ -z "$stale" ] || { echo "Local image defaults must stay pinned to :latest:"; echo "$stale"; exit 1; }
      - name: Kubernetes manifests are up to date and render
        run: |
          sh deploy/kubernetes/sync-config.sh
          git diff --exit-code -- deploy/kubernetes || { echo "Run deploy/kubernetes/sync-config.sh and commit the copies"; exit 1; }
          kubectl kustomize deploy/kubernetes/base > /dev/null
          kubectl kustomize deploy/kubernetes/example > /dev/null
          # The optional parts too: an overlay with the Data API, its Ingress and the NetworkPolicies enabled.
          cp -R deploy/kubernetes "$RUNNER_TEMP/k8s"
          sed -i -e 's|# - \.\./components/dataapi|- ../components/dataapi|' \
            -e 's|# - \.\./components/networkpolicies|- ../components/networkpolicies|' \
            -e 's|# - ingress-dataapi.yaml.*|- ingress-dataapi.yaml|' "$RUNNER_TEMP/k8s/example/kustomization.yaml"
          kubectl kustomize "$RUNNER_TEMP/k8s/example" | grep -c 'kind: NetworkPolicy'
      - name: Production Compose files are valid
        env:
          UME_CERTS_DIR: /certs
          UME_SECRETS_DIR: /secrets
          UME_OIDC_AUTHORITY: https://idp.example.se
          UME_GATEWAY_HOST: llm.example.se
          UME_GATEWAY_PUBLIC_URL: https://llm.example.se
          GATEWAY_IMAGE: gateway
          ADMINAPI_IMAGE: adminapi
          MIGRATIONS_IMAGE: migrations
        run: |
          for file in deploy/compose.prod.yaml deploy/compose.portainer.yaml; do
            docker compose -f "$file" --profile data config --quiet
          done
          docker compose -f deploy/compose.prod.yaml -f deploy/compose.rolling.yaml --profile data config --quiet
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.403
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/admin-ui/package-lock.json
            tests/e2e/package-lock.json
      - name: Build and test backend
        env:
          # Testcontainers pulls Postgres, Redis and its Ryuk image from Docker Hub, whose anonymous pull limit is shared by
          # every job on the runner's address and has failed whole test runs; Google's mirror of Docker Hub is not subject to it.
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
        run: |
          dotnet build UmeLlmGateway.slnx -c Release --nologo
          # Tests marked [Trait(TestCategory.Name, TestCategory.Flaky)] (timing or race dependent) run locally and in the
          # weekly flake hunt, not here: a known flake should not fail a pull request (docs/local-development.md).
          dotnet test --solution UmeLlmGateway.slnx -c Release --no-build --filter-not-trait "Category=Flaky"
          dotnet list UmeLlmGateway.slnx package --vulnerable --include-transitive --format json > /tmp/ume-package-audit.json
          python -c "import json; d=json.load(open('/tmp/ume-package-audit.json')); p=[p for x in d.get('projects',[]) for f in x.get('frameworks',[]) for k in ('topLevelPackages','transitivePackages') for p in f.get(k,[]) if p.get('vulnerabilities')]; assert not p, 'Vulnerable .NET dependencies detected'"
      - name: Scan the service base image
        # The pinned runtime image (Directory.Build.targets) is shared by every service; fail on fixable HIGH/CRITICAL so a
        # stale digest does not ship known runtime CVEs. Every run scans it, which also catches CVEs published since it was
        # pinned; the weekly flake hunt scans it too.
        run: |
          image="$(dotnet msbuild src/Ume.LlmGateway.Gateway -getProperty:ContainerBaseImage)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
      - name: Verify UI
        working-directory: src/admin-ui
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=low
      - name: Audit browser dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx tsc --noEmit
          npm audit --audit-level=low
      - name: Publish and generate SPDX SBOM
        # Only the release uses it (release.yml attaches it to the GitHub release).
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet publish src/Ume.LlmGateway.AdminApi -c Release -o /tmp/ume-release /p:PublishAdminUi=true
          dnx Microsoft.Sbom.DotNetTool@4.1.13 -y -- generate -b /tmp/ume-release -bc src -pn Ume.LlmGateway -pv "$(dotnet msbuild src/Ume.LlmGateway.AdminApi -getProperty:Version)" -ps "Umea kommun" -nsb https://www.umea.se/llm-gateway -V Warning
      - name: Upload release SBOM only
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ume-gateway-spdx
          path: /tmp/ume-release/_manifest
