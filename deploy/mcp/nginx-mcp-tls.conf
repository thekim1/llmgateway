# TLS and the API key in front of a stdio bridge: production gateways call MCP servers over https only, and the bridge
# (supergateway 4.1.0) does not check keys itself. The certificate is issued by the deployment's internal CA
# (deploy/certs/ca.pem), which the gateway and admin API trust. authorized-keys.map holds one line per accepted key:
#   "Bearer <key>" 1;
pid /tmp/nginx.pid;
events {}
http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log off;
    server_tokens off;
    map $http_authorization $mcp_authorized {
        default 0;
        include /run/app-secrets/authorized-keys.map;
    }
    server {
        listen 8443 ssl;
        ssl_certificate     /run/certs/mcp-time.crt;
        ssl_certificate_key /run/certs/mcp-time.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;
        location = /mcp {
            if ($mcp_authorized = 0) { return 401; }
            proxy_pass http://mcp-time-bridge:8000;
            proxy_http_version 1.1;
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location / { return 404; }
    }
}
