# The read-only Data API. Each replica applies DataApi__RequestsPerMinute per client on its own, so with two replicas
# a client may make up to twice as many requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataapi
  labels: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  minReadySeconds: 5
  selector:
    matchLabels: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
      containers:
        - name: dataapi
          image: ume-llm-gateway/dataapi:0.5.0
          ports: [{name: https, containerPort: 8443}]
          envFrom:
            - configMapRef: {name: ume-dataapi-config}
          env:
            - {name: ASPNETCORE_ENVIRONMENT, value: Production}
            - {name: Security__SecretsDirectory, value: /run/app-secrets}
            - {name: Kestrel__Endpoints__Https__Url, value: "https://+:8443"}
            - {name: Kestrel__Endpoints__Https__Certificate__Path, value: /run/certs/dataapi.crt}
            - {name: Kestrel__Endpoints__Https__Certificate__KeyPath, value: /run/certs/dataapi.key}
            - {name: SSL_CERT_FILE, value: /run/certs/ca.pem}
            - {name: OTEL_SERVICE_NAME, value: dataapi}
            - {name: Shutdown__DrainSeconds, value: "10"}
            - {name: DOTNET_SHUTDOWNTIMEOUTSECONDS, value: "40"}
          startupProbe:
            httpGet: {path: /health/live, port: https, scheme: HTTPS}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: https, scheme: HTTPS}
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health/live, port: https, scheme: HTTPS}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: secrets, mountPath: /run/app-secrets, readOnly: true}
            - {name: certs, mountPath: /run/certs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: ume-dataapi-secrets, defaultMode: 0440}
        - name: certs
          secret: {secretName: ume-dataapi-certs, defaultMode: 0440}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dataapi
  labels: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
spec:
  selector: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dataapi
  labels: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ume-llm-gateway, app.kubernetes.io/component: dataapi}
