  - generic [ref=e376]:
    - generic [ref=e377]: Not either or
    - heading "eneo can run on top of the gateway and get these safeguards without changes" [level=2] [ref=e378]
    - paragraph [ref=e379]: eneo talks to AI models through a standard interface, which the gateway provides. We pointed eneo at the gateway and tested it.
    - generic [ref=e380]:
      - generic [ref=e381]:
        - heading "Personal data" [level=3] [ref=e382]
        - generic [ref=e383]: Redacted before the AI model
        - paragraph [ref=e387]: The same message sent through eneo reached the model as “[PERSONNUMMER], [E-POST], [TELEFON]”.
      - generic [ref=e388]:
        - heading "Provider failure" [level=3] [ref=e389]
        - generic [ref=e390]: Answered by the backup provider
        - paragraph [ref=e394]: With the main AI provider unreachable, eneo's user still got an answer; the gateway switched automatically.
    - paragraph [ref=e395]: eneo still saves the original message in its own chat history. The gateway protects what is sent to the AI model, not eneo's database.
  - generic [ref=e397]:
    - generic [ref=e398]: Reading the results fairly
    - heading "Different kinds of product, measured on the same task" [level=2] [ref=e399]
    - generic [ref=e400]:
      - generic [ref=e401]:
        - heading "What eneo does extra" [level=3] [ref=e402]
        - paragraph [ref=e403]: "eneo is a full chat application: it stores every conversation, resolves assistants, spaces and permissions, and counts tokens for each message. The gateway passes requests on to the AI model and records usage, which is its whole job. Both checked an API key, a rate limit and recorded the use of the key for every message."
      - generic [ref=e404]:
        - heading "What it means in practice" [level=3] [ref=e405]
        - paragraph [ref=e406]: For one user the difference is hidden behind the AI model's own answer time. For many users it decides how much hardware is needed and whether the service stays up at peak load.
      - generic [ref=e407]:
        - heading "The gateway's own limit" [level=3] [ref=e408]
        - paragraph [ref=e409]: One gateway instance on 4 vCPUs handled about 18 000 messages per second. With more vCPUs the test machine itself (the simulated AI model and the load generator) became the limit. That is far above expected load, and more instances can be added.
      - generic [ref=e410]:
        - heading "How it was measured" [level=3] [ref=e411]
        - paragraph [ref=e412]:
          - text: "Same machine (8-core AMD Ryzen 7 9800X3D), same simulated AI model, each platform given the same processor cores; eneo v2.2.1 built from its official release, with its background worker running as in its own production set-up. Both were called like an external application: the gateway with a virtual key, eneo with a service API key scoped to one assistant (a new conversation per message, streamed). Measured 20 October 2026; each figure is 20 seconds of steady load, and every answer was checked. Scripts:"
          - code [ref=e413]: benchmarks/compare
          - text: .